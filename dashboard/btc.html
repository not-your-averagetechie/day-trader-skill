<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC Analysis</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--mut:#667085;--line:#e4e7ec;--up:#12805c;--dn:#c0352b;--acc:#2f5bea;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#e8ebf0;--mut:#8b94a3;--line:#262c36;--up:#3ecf9a;--dn:#ff6b60;--acc:#6e8dff;--warn:#e0a84a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,system-ui,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:18px;margin:0}a{color:var(--acc)}main{max-width:1200px;margin:0 auto;padding:20px 24px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 12px;display:flex;justify-content:space-between;gap:8px}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--mut);text-transform:none;letter-spacing:0}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stats div span{display:block;color:var(--mut);font-size:12px}.stats div b{font-size:16px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:12px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{padding:2px 10px;border-radius:99px;font-weight:600;font-size:12px}.pill.up{background:color-mix(in srgb,var(--up) 16%,transparent)}.pill.dn{background:color-mix(in srgb,var(--dn) 15%,transparent)}.pill.mx{background:var(--line);color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid2{grid-template-columns:1fr}main{padding:12px}}
ul{margin:0;padding-left:18px}li{margin:4px 0}svg text{fill:var(--mut);font-size:11px}.note{font-size:12px;color:var(--mut);margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}.kv span:nth-child(odd){color:var(--mut)}
</style></head><body>
<header><h1>BTC Analysis · Hyperliquid perp</h1><div><a href="/">← dashboard</a> <span class="tag" id="upd">loading…</span></div></header>
<main id="app"><div class="card">Fetching live candles…</div></main>
<script>
const fmt=(x,d=2)=>x==null?'–':Number(x).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const cls=v=>v>=0?'up':'dn';
function chart(a){
  const cs=a.chart,e=a.chart_ema20,W=900,H=300,L=58,R=10,T=10,B=22;
  const hi=Math.max(...cs.map(c=>c[1])),lo=Math.min(...cs.map(c=>c[2])),pad=(hi-lo)*.04;
  const y=v=>T+(H-T-B)*(hi+pad-v)/(hi-lo+2*pad),bw=(W-L-R)/cs.length,x=i=>L+bw*(i+.5);
  const v15=a.views[1];
  const grid=[0,1,2,3,4].map(k=>{const v=lo+(hi-lo)*k/4;return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end">${fmt(v,0)}</text>`}).join('');
  const lv=(v,c,t)=>v<hi+pad&&v>lo-pad?`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-dasharray="5 4" opacity=".8"/><text x="${W-R-2}" y="${y(v)-3}" text-anchor="end" style="fill:${c}">${t} ${fmt(v,0)}</text>`:'';
  const candles=cs.map((c,i)=>{const up=c[3]>=c[0],col=up?'var(--up)':'var(--dn)';return `<line x1="${x(i)}" x2="${x(i)}" y1="${y(c[1])}" y2="${y(c[2])}" stroke="${col}"/><rect x="${x(i)-bw*.35}" y="${y(Math.max(c[0],c[3]))}" width="${bw*.7}" height="${Math.max(1,Math.abs(y(c[0])-y(c[3])))}" fill="${col}"/>`}).join('');
  const line=`<path d="M${e.map((v,i)=>x(i)+','+y(v)).join('L')}" fill="none" stroke="var(--acc)" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}${lv(v15.high20,'var(--warn)','15m 20-high')}${lv(v15.low20,'var(--warn)','15m 20-low')}${candles}${line}</svg>`;
}
function read(a){
  const v=Object.fromEntries(a.views.map(x=>[x.interval,x])),pts=[];
  pts.push(`<b>Bias: ${a.bias}.</b> ${a.ups} of 5 timeframes are in an uptrend (price above its 20 and 50 EMA, 20 above 50), ${a.downs} in a downtrend.`);
  const lt=['4h','1d'].map(k=>`${k} ${v[k].trend}`).join(', '),st=['5m','15m'].map(k=>`${k} ${v[k].trend}`).join(', ');
  pts.push(`Higher timeframes: ${lt}. Lower timeframes: ${st}.${(v['4h'].trend==='down'||v['1d'].trend==='down')&&(v['5m'].trend==='up')?' Short-term strength is running against the bigger trend, so bounces are more likely to fail.':''}`);
  const r=v['1h'].rsi;pts.push(`1h RSI ${fmt(r,0)} (${r>70?'overbought':r<30?'oversold':'neutral'}); 15m RSI ${fmt(v['15m'].rsi,0)}.`);
  pts.push(`Range to watch on 15m: support ${fmt(v['15m'].low20,0)}, resistance ${fmt(v['15m'].high20,0)} (20-candle low / high). A close outside it on 1.5x volume is what the signal engine waits for.`);
  pts.push(`Funding ${fmt(a.funding_hr*100,4)}%/h (about ${fmt(a.funding_apr*100,1)}% a year): ${a.funding_hr>0.00003?'longs are paying a premium, crowded long':a.funding_hr<-0.00003?'shorts are paying, crowded short':'close to neutral, no crowding signal'}.`);
  const live=a.views.filter(x=>x.signal);pts.push(live.length?`<b>Signal firing now:</b> ${live.map(x=>x.interval+' '+x.signal.toUpperCase()).join(', ')}.`:'No 5m or 15m signal on the last completed candle right now.');
  return `<ul>${pts.map(p=>`<li>${p}</li>`).join('')}</ul>`;
}
function render(a){
  const tr=t=>`<span class="pill ${t==='up'?'up':t==='down'?'dn':'mx'}">${t}</span>`;
  const h=(x)=>x.fires?`${x.fires} fires · ${x.target}T/${x.stop}S · ${x.avg_R>=0?'+':''}${fmt(x.avg_R,2)}R`:'no fires';
  const pl=(s)=>{const p=a.plans[s];return `<div><b class="${s==='long'?'up':'dn'}">${s.toUpperCase()} now</b> (15m, ATR stop)<div class="kv" style="margin-top:6px"><span>Entry</span><span>$${fmt(p.entry,1)}</span><span>Stop</span><span>$${fmt(p.stop,1)} (${fmt(p.stop_pct*100,2)}%)</span><span>Target</span><span>$${fmt(p.target,1)}</span><span>Size</span><span>$${fmt(p.notional)} notional, 1x</span><span>Risk / reward</span><span>-$${fmt(p.loss_at_stop)} / +$${fmt(p.gain_at_target)}</span></div></div>`};
  document.getElementById('app').replaceChildren(
   $(`<div class="card"><div style="display:flex;flex-wrap:wrap;gap:24px;align-items:baseline"><span class="big">$${fmt(a.price,1)}</span><span class="${cls(a.chg_24h)}" style="font-size:18px;font-weight:600">${a.chg_24h>=0?'+':''}${fmt(a.chg_24h*100,2)}% 24h</span><span class="pill ${/bull|up/.test(a.bias)?'up':/bear|down/.test(a.bias)?'dn':'mx'}" style="font-size:14px">${a.bias}</span></div>
   <div class="stats" style="margin-top:14px"><div><span>24h volume</span><b>$${fmt(a.volume_24h/1e9,2)}B</b></div><div><span>Open interest</span><b>$${fmt(a.open_interest_usd/1e9,2)}B</b></div><div><span>Funding / hour</span><b>${fmt(a.funding_hr*100,4)}%</b></div><div><span>Funding APR</span><b>${fmt(a.funding_apr*100,1)}%</b></div><div><span>Perp premium</span><b>${fmt(a.premium*100,3)}%</b></div><div><span>Max leverage</span><b>${a.max_leverage}x</b></div></div></div>`),
   $(`<div class="card"><h2><span>15-minute chart · last 24 h · blue = 20 EMA</span></h2>${chart(a)}</div>`),
   $(`<div class="card"><h2>What the data says</h2>${read(a)}</div>`),
   $(`<div class="card"><h2>Multi-timeframe</h2><div style="overflow-x:auto"><table><thead><tr><th>TF</th><th>Trend</th><th class="n">RSI</th><th class="n">vs 20 EMA</th><th class="n">ATR %</th><th class="n">Vol vs avg</th><th class="n">Support</th><th class="n">Resistance</th><th>Signal rule history (long)</th><th>(short)</th></tr></thead><tbody>
   ${a.views.map(v=>`<tr><td><b>${v.interval}</b></td><td>${tr(v.trend)}</td><td class="n">${fmt(v.rsi,0)}</td><td class="n ${cls(v.close-v.ema20)}">${fmt((v.close/v.ema20-1)*100,2)}%</td><td class="n">${fmt(v.atr_pct*100,2)}%</td><td class="n">${fmt(v.vol_x,1)}x</td><td class="n">${fmt(v.low20,0)}</td><td class="n">${fmt(v.high20,0)}</td><td>${h(v.hist_long)}</td><td>${h(v.hist_short)}</td></tr>`).join('')}</tbody></table></div>
   <div class="note">Support / resistance = prior 20-candle low / high. History = the same breakout rule re-run on the last 200-300 candles of that timeframe, net of fees (T = target hit, S = stop hit). Small samples: treat as colour, not proof.</div></div>`),
   $(`<div class="card"><h2><span>If you traded it now</span><span class="tag">$100 size · $30 max loss · 1x · not a recommendation</span></h2><div class="grid2">${pl('long')}${pl('short')}</div></div>`));
  document.getElementById('upd').textContent='updated '+a.as_of+' · refreshes every 20 s';
}
async function load(){try{const r=await fetch('/api/btc');const a=await r.json();if(a.error)throw new Error(a.error);render(a)}catch(e){document.getElementById('upd').textContent='error: '+e.message}}
load();setInterval(load,20000);
</script></body></html>
